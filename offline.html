<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5d42">
<title>آفلاین | سامانه صابر</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1f5d42;color:#fff;font-family:Tahoma,sans-serif;text-align:right;padding:20px}
  .box{max-width:420px;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:32px 24px}
  h1{margin:0 0 14px;font-size:22px}
  p{margin:0 0 24px;line-height:2;font-size:15px}
  button{width:100%;min-height:48px;border:0;border-radius:10px;background:#fff;color:#1f5d42;font:bold 16px Tahoma,sans-serif;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <h1>شما در حالت آفلاین هستید</h1>
    <p>اتصال اینترنت خود را بررسی کنید. به محض اتصال، به صورت خودکار به سامانه بازمی‌گردید.</p>
    <button onclick="location.reload()">تلاش مجدد</button>
  </div>
  <script>window.addEventListener('online',function(){location.href='./'});</script>
</body>
</html>
